name: Fix Kotlin build and commit

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix duplicated Home date-picker declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/manibharathi/activity/MainActivity.kt")
          s = p.read_text()
          old = 'var pickDate by remember{mutableStateOf(false)}val c=androidx.compose.ui.platform.LocalContext.current;var pickDate by remember{mutableStateOf(false)}'
          new = 'var pickDate by remember{mutableStateOf(false)}'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print("Fixed duplicated declarations.")
          else:
              print("Target duplicate declaration not present; no source change.")
          PY

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add app/src/main/java/com/manibharathi/activity/MainActivity.kt
          git commit -m "Fix duplicate date picker declarations"
          git push
